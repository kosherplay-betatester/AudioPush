[package]
name = "audiopush"
version = "0.1.4"
edition = "2021"
description = "Stream Windows system audio to another PC on the LAN with minimal latency"
license = "MIT"

[dependencies]
# Immediate-mode GUI, compiled into the binary. No runtime, no web view.
eframe = "0.37.0"
hmac = "0.13.0"
# Enumerating local IPv4 addresses for discovery, the scan and the receiver screen.
if-addrs = "0.15.0"
rand = "0.10.3"
sha2 = "0.11.1"
# Optional notification-area icon.
tray-icon = "0.26.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
# Event-driven WASAPI loopback capture and render.
wasapi = "0.27.0"
# MMCSS "Pro Audio" registration and the 1 ms timer resolution.
windows = { version = "0.62.2", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    # Opening the release page without handing a URL to a command shell.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# One self-contained .exe, optimised for the audio hot path.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Panics stay unwinding on purpose: a failure in one worker thread must not
# take the whole app down mid-stream.
panic = "unwind"
